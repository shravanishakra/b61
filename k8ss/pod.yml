apiVersion: v1
kind: Pod
metadata:
   name: nginx-pod
   labels:
    app: nginx
#container create inpod 
spec:
  containers:
    - name: mycontainer
      image: nginx:latest
      ports: 
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: mysvr 
spec:
  selector:
    app: nginx
  ports:
        - port: 80
          targetPort: 80 

