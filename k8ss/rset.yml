apiVersion: apps/v1
kind: ReplicaSet
metadata:
   name: nginx-replicas
spec:
    replicas: 4
    selector:
      matchLabels:
         app: nginx
      matchExpressions:
      - {key: app, selector: NotIn, values: [shraa, aru]}
    template:
      metadata:
        labels:
          app: shraa
      spec:
        containers:
          - name: nginx-replicas
            image: apache2
            ports: 
             - containerPort: 80