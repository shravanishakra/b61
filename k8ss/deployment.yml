apiVersion: apps/v1
kind: Deployment
metadata:
      name:  my-app
      labels:
        app:  my-app
spec:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 1
      selector:
        matchLabels:
          app: my-app
      replicas: 3
      template: 
        metadata:
          labels:
            app: my-app
        spec:
          containers:
            - name: my-cont
              image: tomcat
              ports:
                - containerPort: 8080